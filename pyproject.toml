[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ome-zarr-tools"
dynamic = ["version"]
description = "Command-line tools for working with OME-Zarr (OME-NGFF) multiscale datasets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Matthieu Chourrout" }]

dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "dask[array]>=2024.4",
    "scipy>=1.11",
    "zarr>=3.0",
    "imageio>=2.34",
    "natsort>=8.4",
    "scikit-image>=0.23",
    "ome-zarr-models>=0.1.4",
    "bioio-ome-zarr>=1.1",
    "ngff-zarr>=0.14",
    "textual>=8.0",
    "textual-autocomplete>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
]
remote = [
    "zarr[remote]>=3.0",
    "gcsfs>=2024.2",
    "s3fs>=2024.2",
]

[project.scripts]
ome-zarr-tools = "ome_zarr_tools.cli:cli"

[project.urls]
Repository = "https://github.com/chourroutm/ome-zarr-tools"
Issues = "https://github.com/chourroutm/ome-zarr-tools/issues"

[tool.setuptools.dynamic]
version = { attr = "ome_zarr_tools.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
packages = ["ome_zarr_tools"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ome_zarr_tools --cov-report=term-missing"
asyncio_mode = "auto"
